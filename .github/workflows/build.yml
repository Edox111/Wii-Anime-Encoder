name: Windows build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Smoke test
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\smoke.ps1
